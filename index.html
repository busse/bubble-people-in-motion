<style>
/* Layout: a fixed 1600×900 slide scaled to the window; every slide is a report page built from typed panels (output, prompt, feature, stats, observation, failure). */
:root {
  --stage: #d9dcd2;
  --paper: #f6f7f1;
  --panel: #ffffff;
  --ink: #1b2019;
  --muted: #5d6459;
  --rule: #d5d9cc;
  --key: #2b8748;
  --key-soft: #e1efe4;
  --prompt: #9a7317;
  --prompt-soft: #f5ecd6;
  --feature: #335c9e;
  --feature-soft: #e2e9f5;
  --observe: #85466f;
  --observe-soft: #f2e4ed;
  --fail: #a93c2a;
  --fail-soft: #f6e2dd;
  --stats: #1b2019;
  --stats-soft: #e9ebe4;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --body: "Literata", Georgia, serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --stage: #0b0d0a; --paper: #151914; --panel: #1c211b; --ink: #e6e9e0; --muted: #9aa294; --rule: #2d3329;
    --key: #5cbd78; --key-soft: #1d3324; --prompt: #d9ae4c; --prompt-soft: #352b15; --feature: #7fa3e0; --feature-soft: #1c2638;
    --observe: #d08cba; --observe-soft: #33202d; --fail: #e2765f; --fail-soft: #3a211b; --stats: #e6e9e0; --stats-soft: #252b23;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --stage: #0b0d0a; --paper: #151914; --panel: #1c211b; --ink: #e6e9e0; --muted: #9aa294; --rule: #2d3329;
  --key: #5cbd78; --key-soft: #1d3324; --prompt: #d9ae4c; --prompt-soft: #352b15; --feature: #7fa3e0; --feature-soft: #1c2638;
  --observe: #d08cba; --observe-soft: #33202d; --fail: #e2765f; --fail-soft: #3a211b; --stats: #e6e9e0; --stats-soft: #252b23;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--stage); color: var(--ink); font: 400 16px/1.5 var(--body); overflow: hidden; }

/* stage + scaling */
.viewport { position: fixed; inset: 0 0 52px 0; overflow: hidden; }
.deck { width: 1600px; height: 900px; position: absolute; left: 50%; top: 50%; transform-origin: center center; transform: translate(-50%, -50%); }
.slide { position: absolute; inset: 0; background: var(--paper); border-radius: 10px; box-shadow: 0 10px 40px rgba(0,0,0,0.18);
  display: grid; grid-template-rows: auto minmax(0, 1fr) auto; padding: 36px 48px 26px; gap: 22px; }
.slide:not(.active) { display: none; }

/* slide chrome */
.slide-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: end; gap: 24px; border-bottom: 2px solid var(--ink); padding-bottom: 14px; }
.kicker { font-family: var(--mono); font-size: 14px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); display: flex; gap: 14px; align-items: center; }
.kicker .when { color: var(--ink); font-weight: 600; }
h1, h2 { font-family: var(--display); font-weight: 700; margin: 4px 0 0; line-height: 1.05; letter-spacing: -0.015em; text-wrap: balance; }
h1 { font-size: 92px; }
h2 { font-size: 46px; }
.head-side { text-align: right; display: grid; gap: 4px; justify-items: end; }
.slide-foot { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 12px; color: var(--muted); }
.body { min-height: 0; display: grid; gap: 18px; }

/* panels */
.panel { background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; padding: 16px 18px; display: grid; gap: 10px; align-content: start; min-height: 0; min-width: 0; }
.tag { font-family: var(--mono); font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; display: inline-flex; align-items: center; gap: 7px; }
.tag::before { content: ""; width: 9px; height: 9px; border-radius: 2px; background: currentColor; }
.t-output { color: var(--key); } .t-prompt { color: var(--prompt); } .t-feature { color: var(--feature); }
.t-observe { color: var(--observe); } .t-fail { color: var(--fail); } .t-stats { color: var(--stats); }
.panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.panel-head .aside { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.panel p { margin: 0; font-size: 17px; line-height: 1.5; }
.panel ul { margin: 0; padding-left: 20px; display: grid; gap: 7px; font-size: 16.5px; line-height: 1.42; }
.panel li::marker { color: var(--observe); }
.panel.feature li::marker { color: var(--feature); }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
code { font-family: var(--mono); font-size: 0.86em; background: var(--stats-soft); padding: 1px 5px; border-radius: 3px; }

/* KPI tiles */
.kpis { display: grid; gap: 12px; }
.kpi { background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; padding: 12px 14px; display: grid; gap: 2px; min-width: 0; }
.kpi b { font-family: var(--display); font-size: 40px; line-height: 1; font-variant-numeric: tabular-nums; }
.kpi span { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.kpi.bad b { color: var(--fail); }
.kpi.good b { color: var(--key); }

/* prompt quote */
.quote { font-family: var(--body); font-style: italic; font-size: 16.5px; line-height: 1.45; border-left: 3px solid var(--prompt); padding: 4px 0 4px 14px; color: var(--ink); margin: 0; }
.wordbar { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: center; font-family: var(--mono); font-size: 13px; color: var(--muted); }
.wordbar .track { height: 8px; background: var(--prompt-soft); border-radius: 4px; overflow: hidden; }
.wordbar .fill { height: 100%; background: var(--prompt); }

/* commits */
.commit { display: grid; grid-template-columns: 76px 64px minmax(0, 1fr); gap: 8px; font-size: 15px; line-height: 1.35; align-items: baseline; }
.commit .sha { font-family: var(--mono); font-size: 13px; color: var(--feature); font-weight: 600; }
.commit .at { font-family: var(--mono); font-size: 12px; color: var(--muted); }

/* failures */
.fail-row { display: grid; grid-template-columns: 58px minmax(0, 1fr); gap: 8px; font-size: 14.5px; line-height: 1.35; padding: 5px 9px; background: var(--fail-soft); border-radius: 4px; }
.fail-row .mono { color: var(--fail); font-size: 12.5px; }

/* clips */
.clip { position: relative; background: #000; border-radius: 4px; overflow: hidden; }
.clip video { display: block; width: 100%; height: 100%; object-fit: cover; }
.clip.land { aspect-ratio: 16 / 9; }
.clip.port { aspect-ratio: 9 / 16; }
.clip .cap { position: absolute; left: 8px; top: 8px; font-family: var(--mono); font-size: 12px; background: rgba(0,0,0,0.6); color: #fff; padding: 2px 7px; border-radius: 3px; }
.clip .cap.std { background: var(--prompt); color: #000; }
.take { display: grid; gap: 5px; min-width: 0; }
.take .note { font-size: 14px; line-height: 1.35; color: var(--muted); }
.source { display: grid; gap: 5px; align-content: start; }
.source img { width: 100%; border-radius: 3px; display: block; }
.source span { font-family: var(--mono); font-size: 11px; color: var(--muted); overflow-wrap: anywhere; }
.outrow { display: grid; gap: 14px; align-items: start; min-height: 0; }

/* chapter slide grid */
.chapter-grid { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 18px; min-height: 0; }
.chapter-side { display: grid; gap: 14px; align-content: start; min-height: 0; }

/* charts */
svg text { font-family: var(--mono); font-size: 13px; fill: var(--muted); }
svg .ink { fill: var(--ink); }
svg .gridline { stroke: var(--rule); stroke-width: 1; }

/* diagram */
.flow { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 0; align-items: stretch; }
.node { position: relative; background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; padding: 14px; margin-right: 26px; display: grid; gap: 6px; align-content: start; }
.node:not(:last-child)::after { content: "→"; position: absolute; right: -24px; top: 50%; transform: translateY(-50%); font-family: var(--mono); font-size: 20px; color: var(--muted); }
.node:last-child { margin-right: 0; }
.node b { font-family: var(--display); font-size: 20px; line-height: 1.15; }
.node span { font-size: 14px; color: var(--muted); line-height: 1.35; }
.node .mono { font-size: 12px; color: var(--feature); }

/* toolbar */
.toolbar { position: fixed; left: 0; right: 0; bottom: 0; height: 52px; display: flex; align-items: center; gap: 12px;
  padding: 0 max(16px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(16px, env(safe-area-inset-left, 0px));
  background: var(--paper); border-top: 1px solid var(--rule); font-family: var(--mono); font-size: 13px; }
.toolbar button, .toolbar select { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--rule); border-radius: 5px; padding: 6px 12px; cursor: pointer; }
.toolbar button:hover { border-color: var(--ink); }
.toolbar select { max-width: 46vw; }
.progress { flex: 1; height: 4px; background: var(--rule); border-radius: 2px; overflow: hidden; }
.progress div { height: 100%; background: var(--key); transition: width 0.25s; }
.counter { color: var(--muted); font-variant-numeric: tabular-nums; min-width: 56px; text-align: right; }
:focus-visible { outline: 2px solid var(--key); outline-offset: 2px; }
a { color: var(--key); }
@media (prefers-reduced-motion: reduce) { .progress div { transition: none; } }

/* Part I additions */
.divider { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 48px; align-items: center; height: 100%; }
.part-num { font-family: var(--mono); font-weight: 600; font-size: 22px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--key); }
.divider-strip { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; align-items: end; }
.divider-strip img { width: 100%; aspect-ratio: 3 / 4; object-fit: cover; border-radius: 4px; background: var(--stats-soft); display: block; }
.divider-strip img:nth-child(odd) { transform: translateY(-24px); }
.part-chip { background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; padding: 12px 14px; display: grid; gap: 4px; }
.part-chip b { font-family: var(--display); font-size: 19px; }
.part-chip span { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.take-grid { display: grid; grid-template-columns: 300px minmax(0, 1.3fr) minmax(0, 1fr); gap: 18px; min-height: 0; }
.ev-grid { display: grid; gap: 10px; }
.ev-tile { margin: 0; display: grid; gap: 5px; min-width: 0; }
.ev-im { aspect-ratio: 1; border-radius: 4px; overflow: hidden; display: grid; place-items: center; background: var(--stats-soft); }
.ev-im img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
.ev-im.fill img { width: 100%; height: 100%; object-fit: cover; }
.ev-tile figcaption { font-family: var(--mono); font-size: 11.5px; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.checker { background-color: #d9dbd3; background-image: conic-gradient(#c7cac0 25%, transparent 0 50%, #c7cac0 0 75%, transparent 0); background-size: 16px 16px; }
.flag { outline: 2px dashed var(--fail); outline-offset: 2px; }
.badge { font-family: var(--mono); font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; padding: 1px 6px; border-radius: 3px; color: #fff; }
.badge.good { background: var(--key); } .badge.partial { background: var(--prompt); } .badge.fail { background: var(--fail); }
.score-row { display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 14px; align-items: center; }
.score-row b { display: block; font-family: var(--display); font-size: 22px; }
.score-row span { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.score-bar { display: flex; gap: 3px; height: 54px; }
.score-bar span { display: flex; align-items: center; padding-left: 10px; font-family: var(--mono); font-size: 17px; color: #fff; overflow: hidden; white-space: nowrap; }
.score-bar .g { background: var(--key); border-radius: 4px 0 0 4px; } .score-bar .p { background: var(--prompt); } .score-bar .f { background: var(--fail); border-radius: 0 4px 4px 0; }
table.types { border-collapse: collapse; width: 100%; font-size: 16px; }
table.types th, table.types td { text-align: left; padding: 9px 10px 9px 0; border-bottom: 1px solid var(--rule); vertical-align: top; }
table.types th { font-family: var(--mono); font-size: 12px; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
table.types .n { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
table.types td.up { color: var(--key); font-weight: 600; }
table.compare td { font-size: 15.5px; line-height: 1.35; }
table.compare td.lab { font-family: var(--mono); font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; width: 130px; }
.cost-row { display: grid; grid-template-columns: 200px minmax(0, 1fr) 80px; gap: 14px; align-items: center; font-size: 16px; }
.cost-row .mono { text-align: right; }
.cost-track { height: 22px; background: var(--prompt-soft); border-radius: 3px; overflow: hidden; }
.cost-track div { height: 100%; background: var(--prompt); min-width: 3px; }
.cost-row.total { border-top: 1px solid var(--rule); padding-top: 12px; font-weight: 600; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .checker { background-color: #2a2f28; background-image: conic-gradient(#232822 25%, transparent 0 50%, #232822 0 75%, transparent 0); } }
:root[data-theme="dark"] .checker { background-color: #2a2f28; background-image: conic-gradient(#232822 25%, transparent 0 50%, #232822 0 75%, transparent 0); }
</style>
</head>

    [prodClip("AttractedToLight-20260508-120427", "8 May"), "bpd: Veo 3.1, green screen"]
  ], ["March keeps the paper, the frame and the whole composition; May keeps only the character and the fish.","Take 6 shows the ghosting of parts that carry painted background with them.","May is the only one you can key and composite over a moving hallway, which was the point."]);
  compareSlide("CarefulwithThatAx", "Careful With That Ax: March vs May", [
    [skipIntro(portClip(dm + "cmp_take5_CarefulwithThatAx_bp_1.mp4", dm + "cmp_take5_CarefulwithThatAx_bp_1.jpg", "8 Mar")), "Take 5: chained frames"],
    [portClip(dm + "cmp_take6_CarefulwithThatAx.mp4", dm + "cmp_take6_CarefulwithThatAx.jpg", "11 Mar"), "Take 6: regenerated parts"],
    [prodClip("multi-axe-vs-chair-20260508-085720", "8 May"), "bpd: two paintings in one clip"]
  ], ["In March this character was “Guardian,” a trading card.","Part I animated one painting at a time; Part II puts two characters from different paintings in one scene.","The May clip needed anti-fattening guards, the same drift toward rounder, smoother figures that take 5 showed."]);

  const compareRows = [
    ["Idea", "Take the painting apart, then move the parts", "Ask a video model for the motion, constrain it with words"],
    ["Language", "Python", "TypeScript"],
    ["Models", "GPT-4o, SAM2, gpt-image-1", "Gemini 2.5 Flash, Veo 3.1"],
    ["Unit of work", "All 37 paintings per take", "One painting, one written direction"],
    ["Output", "1080×1920 showcase reels", "3840×2160 clips on #00B140 for Final Cut"],
    ["Time and spend", "3 days · ~$12", "2 days · $48"],
    ["Main failure", "Masks, colour rules, identity drift", "Veo adds things: buses, walls, handrails, bulk"],
    ["Record", "Case studies + cost ledger", "Per-run logs + cost register"]
  ];
  addSlide("Epilogue · synthesis", "Two parts, one problem", h("div", { class: "chapter-grid", style: "grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)" },
    panel("stats", "Part I vs Part II", null, h("table", { class: "types compare" },
      h("thead", {}, h("tr", {}, h("th", { text: "" }), h("th", { text: "I · Take it apart" }), h("th", { text: "II · Video model" }))),
      h("tbody", {}, compareRows.map(([label, a, b]) => h("tr", {}, h("td", { class: "lab", text: label }), h("td", { text: a }), h("td", { text: b })))))),
    h("div", { class: "chapter-side" },
      panel("feature", "What carried over", null, bullets(["The 37 paintings and the goal: fidelity to the hand that made them","A vision pre-pass before generating anything","Logging every dollar and every run","Committing in a burst, then not at all"])),
      panel("observe", "What changed", null, h("p", { text: "Part I fought to separate figure from paper and then to make the figure move. Part II let the model handle both and spent its effort on telling the model what not to do." }))))
  );

  // 19. Still on paper
  const used = new Set(chapters.flatMap(chapter => chapter.sources));
  const waiting = allPaintings.filter(name => !used.has(name));
  addSlide("Next", "Twenty-six paintings still on the paper", h("div", { class: "chapter-grid", style: "grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)" },
    panel("output", "Not yet animated", waiting.length + " of 37", h("div", { style: "display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:8px" },
      waiting.map(name => h("img", { src: `media/paint/${name}.jpg`, alt: name, title: name, style: "width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:3px;display:block" })))),
    h("div", { class: "chapter-side" },
      panel("prompt", "Ready but unrun", null, h("p", { html: null, text: "prompts/multi/halo-meets-busker.md pairs the pho BP with the busker. It was written to test whether Veo keeps two characters distinct." })),
      panel("observe", "Where the work points", null, bullets(["The prompt skeleton is stable enough to template.","Commit as you go: day two sat outside git for five months.","Clips need a home outside git; previews here are small copies of 2.1 GB of output."])),
      panel("feature", "Also in this folder", null, h("p", {}, "The full text of every prompt: ", h("a", { href: "prompts-archive.html", text: "prompts archive" }), ". The same content as one long page: ", h("a", { href: "gallery.html", text: "scroll view" }), ".")))
  ));

  /* ---------- render ---------- */
  const deck = document.getElementById("deck");
  const jump = document.getElementById("jump");
  slides.forEach((slide, index) => {
    const head = slide.bare ? h("div") : h("header", { class: "slide-head" },
      h("div", {}, h("div", { class: "kicker", text: slide.kicker }), h("h2", { text: slide.title })),
      h("div", { class: "head-side" }));
    const foot = h("footer", { class: "slide-foot" }, h("span", { text: "Bubble People in Motion · bpd" }), h("span", { text: `${index + 1} / ${slides.length}` }));
    if (slide.bare) head.append(h("div", { class: "kicker", text: slide.kicker }));
    deck.append(h("article", { class: "slide", id: "s" + (index + 1), "aria-roledescription": "slide", "aria-label": `${index + 1} of ${slides.length}` }, head, h("div", { class: "body" }, slide.body), foot));
    jump.append(h("option", { value: index, text: `${index + 1}. ${slide.title || "Bubble People in Motion"}` }));
  });

  const slideEls = [...deck.children];
  let current = 0;
  const setVideos = (slideEl, active) => slideEl.querySelectorAll("video").forEach(video => {
    if (active) {
      if (!video.src) video.src = video.dataset.src;
      video.muted = true;
      video.play().catch(() => {});
    } else video.pause();
  });
  const show = index => {
    current = Math.max(0, Math.min(slides.length - 1, index));
    slideEls.forEach((el, i) => { const active = i === current; el.classList.toggle("active", active); setVideos(el, active); });
    jump.value = current;
    document.getElementById("counter").textContent = `${current + 1} / ${slides.length}`;
    document.getElementById("bar").style.width = `${((current + 1) / slides.length) * 100}%`;
    try { history.replaceState(null, "", "#s" + (current + 1)); } catch (error) {}
  };
  const fit = () => {
    const viewport = document.getElementById("viewport");
    const scale = Math.min((viewport.clientWidth - 24) / 1600, (viewport.clientHeight - 24) / 900);
    deck.style.transform = `translate(-50%, -50%) scale(${Math.max(scale, 0.1)})`;
  };
  document.getElementById("prev").addEventListener("click", () => show(current - 1));
  document.getElementById("next").addEventListener("click", () => show(current + 1));
  jump.addEventListener("change", () => show(Number(jump.value)));
  document.addEventListener("keydown", event => {
    if (event.target.tagName === "SELECT") return;
    if (["ArrowRight","PageDown"," "].includes(event.key)) { event.preventDefault(); show(current + 1); }
    if (["ArrowLeft","PageUp"].includes(event.key)) { event.preventDefault(); show(current - 1); }
    if (event.key === "Home") show(0);
    if (event.key === "End") show(slides.length - 1);
  });
  window.addEventListener("resize", fit);
  const fromHash = Number((location.hash.match(/^#s(\d+)$/) || [])[1]);
  fit();
  show(fromHash ? fromHash - 1 : 0);
})();
</script>
</body>
